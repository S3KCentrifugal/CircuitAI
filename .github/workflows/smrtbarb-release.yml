# SMRTBARb: build the Skirmish AI for Windows and Linux with BAR's Recoil docker
# build harness and publish both as one GitHub release.
#
# SMRTBARb is this fork's alias of BARb (upstream: rlcevg/CircuitAI, branch
# barbarian). The engine is not in this repository: each build job checks out
# beyond-all-reason/RecoilEngine at the commit pinned in .github/recoil-engine.ref,
# mounts this repository as its AI/Skirmish/BARb (read-only, exactly as the local
# build does), configures the engine once and compiles only the BARb target.
#
# Two build jobs run side by side (amd64-windows, amd64-linux); each uploads its
# archive (Windows .zip, Linux .tar.gz) and debug-symbols archive as a workflow
# artifact. Releases come from two channels, named after the branch:
#   smrt-test -> tag v<version>-test, a GitHub pre-release
#   smrt-prod -> tag v<version>-prod, the "Latest" release
# (tools/release/version.sh: MAJOR from SMRTBARb_VERSION, MINOR = commit count).
# The release job runs only when BOTH builds succeeded, and refuses to publish
# unless both platforms' archives are present: a release always carries Windows
# and Linux. The release notes are generated from the commits since the
# channel's previous release (tools/release/notes.py).
# Pull requests (and other branches) build and upload the artifacts only.
name: SMRTBARb build and release

on:
  push:
    branches: [smrt-test, smrt-prod]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release from this run (smrt-test or smrt-prod only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: smrtbarb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false   # see both platforms' results; the release needs both anyway
      matrix:
        include:
          - os: windows
            platform: amd64-windows
            lib: SkirmishAI.dll
            dbg: SkirmishAI.dbg
          - os: linux
            platform: amd64-linux
            lib: libSkirmishAI.so
            dbg: libSkirmishAI.dbg
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out SMRTBARb
        uses: actions/checkout@v4
        with:
          path: smrtbarb
          fetch-depth: 0   # the minor version is the commit count

      - name: Version
        id: version
        run: |
          v="$(smrtbarb/tools/release/version.sh)"
          case "${{ github.ref_name }}" in
            smrt-prod) channel=prod ;;
            smrt-test) channel=test ;;
            *)         channel=dev ;;
          esac
          echo "SMRTBARB_CHANNEL=$channel" >> "$GITHUB_ENV"
          v="$v-$channel"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "engine=$(tr -d ' \r\n' < smrtbarb/.github/recoil-engine.ref)" >> "$GITHUB_OUTPUT"
          echo "SMRTBARb v$v (${{ matrix.os }})"

      - name: Check out RecoilEngine
        uses: actions/checkout@v4
        with:
          repository: beyond-all-reason/RecoilEngine
          ref: ${{ steps.version.outputs.engine }}
          path: engine
          fetch-depth: 0   # the engine's CMake derives its version from git

      - name: Engine submodules (all but AI/Skirmish/BARb, which is this repository)
        working-directory: engine
        run: |
          paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | grep -vx 'AI/Skirmish/BARb')
          git submodule update --init --recursive --depth 1 -- $paths
          # BARb stays uninitialised: the build mounts this repository there
          touch .i-understand-git-submodules.txt

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: engine/.cache/ccache-${{ matrix.platform }}
          key: ccache-${{ matrix.platform }}-${{ steps.version.outputs.engine }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ steps.version.outputs.engine }}-

      - name: Configure
        working-directory: engine
        env:
          CONTAINER_RUNTIME_EXTRA_ARGS: -v ${{ github.workspace }}/smrtbarb:/build/src/AI/Skirmish/BARb:ro
        run: ./docker-build-v2/build.sh --configure ${{ matrix.os }}

      - name: Compile the BARb target only
        working-directory: engine
        env:
          CONTAINER_RUNTIME_EXTRA_ARGS: -v ${{ github.workspace }}/smrtbarb:/build/src/AI/Skirmish/BARb:ro
        run: |
          # a custom target skips the harness's install step, but its windows
          # post-step (split-debug-info.sh) still cds into install/: give it one
          mkdir -p "build-${PLATFORM}/install"
          ./docker-build-v2/build.sh --compile ${{ matrix.os }} --target BARb

      - name: Split the debug info (as the harness does for the engine)
        working-directory: engine
        run: |
          source docker-build-v2/images_versions.sh
          image="ghcr.io/beyond-all-reason/recoil-build-${PLATFORM}@${image_version[$PLATFORM]}"
          out="$PWD/build-${PLATFORM}/AI/Skirmish/BARb/data"
          if [ ! -f "$out/${{ matrix.lib }}" ]; then
            echo "::error::${{ matrix.lib }} not in $out; the build produced:"
            find "$PWD/build-${PLATFORM}" -name '*SkirmishAI*' 2>/dev/null
            exit 1
          fi
          ls -la "$out"
          docker run --rm -v "$out":/ai -e LIB="${{ matrix.lib }}" -e DBG="${{ matrix.dbg }}" "$image" bash -c '
            set -e
            cd /ai
            objcopy --only-keep-debug "$LIB" "$DBG"
            strip --strip-debug --strip-unneeded "$LIB"
            objcopy --add-gnu-debuglink="$DBG" "$LIB"
            chmod a+r "$LIB" "$DBG"'
          ls -la "$out"

      - name: Package
        run: |
          out="engine/build-${PLATFORM}/AI/Skirmish/BARb/data"
          smrtbarb/tools/release/package.sh "$out/${{ matrix.lib }}" dist "$out/${{ matrix.dbg }}"
          ls -la dist
          case "${{ matrix.os }}" in
            windows) unzip -l dist/*-windows.zip | tail -5 ;;
            linux)   tar -tzvf dist/*-linux.tar.gz | grep -v '/script/\|/config/' ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMRTBARb-v${{ steps.version.outputs.version }}-${{ matrix.os }}
          path: dist/SMRTBARb-*
          if-no-files-found: error

  release:
    needs: build   # both platforms built, or no release
    if: >-
      (github.ref_name == 'smrt-test' || github.ref_name == 'smrt-prod') &&
      ((github.event_name == 'push') ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out SMRTBARb
        uses: actions/checkout@v4
        with:
          path: smrtbarb
          fetch-depth: 0   # the version, and the notes' commit range

      - name: Version
        id: version
        run: |
          v="$(smrtbarb/tools/release/version.sh)"
          case "${{ github.ref_name }}" in
            smrt-prod) channel=prod ;;
            *)         channel=test ;;
          esac
          echo "base=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$v-$channel" >> "$GITHUB_OUTPUT"

      - name: Download both builds
        uses: actions/download-artifact@v4
        with:
          pattern: SMRTBARb-v${{ steps.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Both platforms present
        run: |
          v="${{ steps.version.outputs.version }}"
          ls -la dist
          for f in "SMRTBARb-v$v-windows.zip" "SMRTBARb-v$v-windows-dbg.zip" \
                   "SMRTBARb-v$v-linux.tar.gz" "SMRTBARb-v$v-linux-dbg.tar.gz"; do
            test -s "dist/$f" || { echo "::error::missing $f: a release carries both platforms"; exit 1; }
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: smrtbarb
        run: |
          v="${{ steps.version.outputs.version }}"
          tag="v$v"
          python3 tools/release/notes.py "${{ steps.version.outputs.base }}" "${{ steps.version.outputs.channel }}" > ../notes.md
          cat ../notes.md
          title="SMRTBARb v$v"
          if [ "${{ steps.version.outputs.channel }}" = "prod" ]; then kind="--latest"; else kind="--prerelease"; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" ../dist/SMRTBARb-* --clobber
            gh release edit "$tag" --notes-file ../notes.md
          else
            gh release create "$tag" ../dist/SMRTBARb-* --target "${{ github.sha }}" --title "$title" --notes-file ../notes.md $kind
          fi

# SMRTBARb: build the Skirmish AI with BAR's Recoil docker build harness and
# publish it as a GitHub release.
#
# SMRTBARb is this fork's alias of BARb (upstream: rlcevg/CircuitAI, branch
# barbarian). The engine is not in this repository: the job checks out
# beyond-all-reason/RecoilEngine at the commit pinned in .github/recoil-engine.ref,
# mounts this repository as its AI/Skirmish/BARb (read-only, exactly as the local
# build does), configures the engine once and compiles only the BARb target.
#
# Every run uploads the zip as a workflow artifact. Releases come from two
# channels, named after the branch:
#   smrt-test -> tag v<version>-test, a GitHub pre-release
#   smrt-prod -> tag v<version>-prod, the "Latest" release
# (tools/release/version.sh: MAJOR from SMRTBARb_VERSION, MINOR = commit count).
# The release notes are generated from the commits since the channel's previous
# release (tools/release/notes.py): grouped, one line per change.
# Pull requests (and other branches) build and upload the artifact only.
name: SMRTBARb build and release

on:
  push:
    branches: [smrt-test, smrt-prod]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release from this run (smrt-test or smrt-prod only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: smrtbarb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PLATFORM: amd64-windows
    steps:
      - name: Check out SMRTBARb
        uses: actions/checkout@v4
        with:
          path: smrtbarb
          fetch-depth: 0   # the minor version is the commit count

      - name: Version
        id: version
        run: |
          v="$(smrtbarb/tools/release/version.sh)"
          case "${{ github.ref_name }}" in
            smrt-prod) channel=prod ;;
            smrt-test) channel=test ;;
            *)         channel=dev ;;
          esac
          echo "base=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "SMRTBARB_CHANNEL=$channel" >> "$GITHUB_ENV"
          v="$v-$channel"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "engine=$(tr -d ' \r\n' < smrtbarb/.github/recoil-engine.ref)" >> "$GITHUB_OUTPUT"
          echo "SMRTBARb v$v"

      - name: Check out RecoilEngine
        uses: actions/checkout@v4
        with:
          repository: beyond-all-reason/RecoilEngine
          ref: ${{ steps.version.outputs.engine }}
          path: engine
          fetch-depth: 0   # the engine's CMake derives its version from git

      - name: Engine submodules (all but AI/Skirmish/BARb, which is this repository)
        working-directory: engine
        run: |
          paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | grep -vx 'AI/Skirmish/BARb')
          git submodule update --init --recursive --depth 1 -- $paths
          # BARb stays uninitialised: the build mounts this repository there
          touch .i-understand-git-submodules.txt

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: engine/.cache/ccache-amd64-windows
          key: ccache-${{ steps.version.outputs.engine }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.version.outputs.engine }}-

      - name: Configure
        working-directory: engine
        env:
          CONTAINER_RUNTIME_EXTRA_ARGS: -v ${{ github.workspace }}/smrtbarb:/build/src/AI/Skirmish/BARb:ro
        run: ./docker-build-v2/build.sh --configure windows

      - name: Compile the BARb target only
        working-directory: engine
        env:
          CONTAINER_RUNTIME_EXTRA_ARGS: -v ${{ github.workspace }}/smrtbarb:/build/src/AI/Skirmish/BARb:ro
        run: |
          # a custom target skips the harness's install step, but its windows
          # post-step (split-debug-info.sh) still cds into install/: give it one
          mkdir -p "build-${PLATFORM}/install"
          ./docker-build-v2/build.sh --compile windows --target BARb

      - name: Split the debug info (as the harness does for the engine)
        working-directory: engine
        run: |
          source docker-build-v2/images_versions.sh
          image="ghcr.io/beyond-all-reason/recoil-build-${PLATFORM}@${image_version[$PLATFORM]}"
          out="$PWD/build-${PLATFORM}/AI/Skirmish/BARb/data"
          ls -la "$out"
          docker run --rm -v "$out":/ai "$image" bash -c '
            set -e
            cd /ai
            objcopy --only-keep-debug SkirmishAI.dll SkirmishAI.dbg
            strip --strip-debug --strip-unneeded SkirmishAI.dll
            objcopy --add-gnu-debuglink=SkirmishAI.dbg SkirmishAI.dll
            chmod a+r SkirmishAI.dll SkirmishAI.dbg'
          ls -la "$out"

      - name: Package
        run: |
          out="engine/build-${PLATFORM}/AI/Skirmish/BARb/data"
          smrtbarb/tools/release/package.sh "$out/SkirmishAI.dll" dist "$out/SkirmishAI.dbg"
          ls -la dist
          unzip -l "dist/SMRTBARb-v${{ steps.version.outputs.version }}.zip" | tail -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMRTBARb-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the GitHub release
        if: >-
          (steps.version.outputs.channel != 'dev') &&
          ((github.event_name == 'push') ||
           (github.event_name == 'workflow_dispatch' && inputs.release))
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: smrtbarb
        run: |
          v="${{ steps.version.outputs.version }}"
          tag="v$v"
          python3 tools/release/notes.py "${{ steps.version.outputs.base }}" "${{ steps.version.outputs.channel }}" > ../notes.md
          cat ../notes.md
          if [ "${{ steps.version.outputs.channel }}" = "prod" ]; then kind="--latest"; title="SMRTBARb v$v"; else kind="--prerelease"; title="SMRTBARb v$v"; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" ../dist/*.zip --clobber
            gh release edit "$tag" --notes-file ../notes.md
          else
            gh release create "$tag" ../dist/*.zip --target "${{ github.sha }}" --title "$title" --notes-file ../notes.md $kind
          fi
